name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 로컬에서 이미 만든 index.html 을 그대로 쓰지 않고 다시 만든다.
      # 마크다운과 실제 배포본이 어긋나는 걸 막는다.
      - run: python build.py
      # 사이트에 필요한 것만 골라서 올린다.
      # 저장소 전체를 올리면 docs/·content/ 같은 작업 파일까지 공개된다.
      - run: |
          mkdir -p _site
          cp index.html _site/
          cp -r project _site/
          mkdir -p _site/demo/inquiry
          cp demo/inquiry/index.html demo/inquiry/core.js demo/inquiry/proposal.pdf demo/inquiry/demo.mp4 _site/demo/inquiry/
          mkdir -p _site/demo/quiz _site/services
          cp demo/quiz/index.html _site/demo/quiz/
          cp services/index.html services/content-1.jpg services/content-2.jpg services/content-3.jpg _site/services/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
